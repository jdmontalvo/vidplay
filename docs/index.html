<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">

<style>

  .logo { width: 96px; height: 96px; border-radius: 24px; background: #241C4A; display: grid; place-items: center; margin: 0 auto 22px; }

  p { color: #A9A9BC; margin: 0 0 26px; }
  a { color: #8B7CFF; text-decoration: none; }
  .links { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }

  <div class="logo" aria-hidden="true">
    <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="#fff"/></svg>

  <div class="links">
